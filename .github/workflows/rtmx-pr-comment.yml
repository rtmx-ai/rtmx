# RTMX PR Comment
# Posts the RTM diff comment on PRs after the "RTMX PR Check" workflow completes.
#
# This workflow runs with elevated permissions in the base-repo context, which
# allows it to post comments even on PRs from forks.  It is intentionally kept
# separate from rtmx-pr.yml (which runs with a restricted token) to follow the
# secure workflow_run pattern recommended by GitHub:
# https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#workflow_run

name: RTMX PR Comment

on:
  workflow_run:
    workflows: ["RTMX PR Check"]
    types:
      - completed

permissions:
  pull-requests: write

jobs:
  comment:
    name: Post RTM Diff Comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'

    steps:
      - name: Download diff artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: download
        with:
          name: rtm-diff-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Post PR comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            // Read PR number saved by rtmx-pr.yml
            let prNumber;
            try {
              prNumber = parseInt(fs.readFileSync('pr-number.txt', 'utf8').trim(), 10);
            } catch (e) {
              core.warning('Could not read pr-number.txt; skipping comment');
              return;
            }
            if (!prNumber) return;

            // Read health status
            let status = 'unknown';
            try {
              const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
              status = health.status || 'unknown';
            } catch (e) { /* ignore */ }

            const statusIcon = {
              'healthy': '[PASS]',
              'degraded': '[WARN]',
              'unhealthy': '[FAIL]'
            };

            let body = '## RTM Changes\n\n';
            body += `**Health Status:** ${statusIcon[status] || '[?]'} ${status}\n\n`;

            // Add diff (may not exist if no baseline or no database.csv)
            try {
              const diff = fs.readFileSync('rtm-diff.md', 'utf8');
              body += diff;
            } catch (e) {
              body += '_No diff available_\n';
            }

            body += '\n\n---\n_Generated by rtmx PR check_';

            // Find existing bot comment and update or create
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('## RTM Changes')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
