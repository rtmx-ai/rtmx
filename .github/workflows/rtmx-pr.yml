# RTMX PR Validation
# Automatically runs on PRs that modify RTM-related files
# Posts a diff comment showing what changed in the RTM
#
# Split into two workflows to support fork PRs:
#   1. rtmx-pr.yml (this file) – runs on pull_request with restricted token,
#      generates artifacts, saves PR metadata.
#   2. rtmx-pr-comment.yml – runs on workflow_run with write token,
#      downloads artifacts and posts the PR comment.

name: RTMX PR Check

on:
  pull_request:
    paths:
      - '.rtmx/database.csv'
      - 'rtmx.yaml'
      - '.rtmx.yaml'
      - '.rtmx/requirements/**'

permissions:
  contents: read

jobs:
  diff-check:
    name: RTM Diff Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0  # Full history for diff

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version-file: go.mod

      - name: Build rtmx
        run: go build -o bin/rtmx ./cmd/rtmx

      - name: Get base RTM
        id: base
        run: |
          # Try to get baseline from base branch
          if git show origin/${{ github.base_ref }}:.rtmx/database.csv > base-rtm.csv 2>/dev/null; then
            echo "baseline_exists=true" >> $GITHUB_OUTPUT
          else
            echo "baseline_exists=false" >> $GITHUB_OUTPUT
            echo "No baseline RTM found in base branch"
          fi

      - name: Run diff
        id: diff
        if: steps.base.outputs.baseline_exists == 'true'
        run: |
          if [ -f .rtmx/database.csv ]; then
            ./bin/rtmx diff base-rtm.csv .rtmx/database.csv --format markdown > rtm-diff.md 2>&1 || true
            echo "diff_generated=true" >> $GITHUB_OUTPUT
          else
            echo "No current RTM found"
            echo "diff_generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Run health check
        id: health
        run: |
          ./bin/rtmx health --format json > health.json 2>&1 || true
          STATUS=$(jq -r '.status' health.json 2>/dev/null || echo "unknown")
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Save PR metadata
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload diff artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rtm-diff-artifacts
          path: |
            pr-number.txt
            rtm-diff.md
            health.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail on unhealthy
        if: steps.health.outputs.status == 'unhealthy'
        run: |
          echo "RTM health check failed"
          ./bin/rtmx health
          exit 1
