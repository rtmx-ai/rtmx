# GoReleaser configuration for RTMX CLI + packaged verifier broker
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: rtmx
    main: ./cmd/rtmx
    binary: rtmx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/rtmx-ai/rtmx/internal/cmd.Version={{.Version}}
      - -X github.com/rtmx-ai/rtmx/internal/cmd.Commit={{.Commit}}
      - -X github.com/rtmx-ai/rtmx/internal/cmd.Date={{.Date}}

  - id: verify
    main: ./cmd/verify
    binary: verify
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - src: packaging/launchd/com.rtmx.verify.plist
        dst: share/rtmx/com.rtmx.verify.plist
      - src: packaging/systemd/verify.service
        dst: share/rtmx/rtmx-verify.service
      - src: packaging/windows/verify-service.json
        dst: share/rtmx/verify-service.json

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

signs:
  - artifacts: all
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Curated notes come from CHANGELOG.md via scripts/github-release-notes.sh
changelog:
  disable: true

release:
  github:
    owner: rtmx-ai
    name: rtmx
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  header: |
    ## Verify Your Download

    ```bash
    # Import RTMX public key
    curl -fsSL https://rtmx.ai/gpg.key | gpg --import

    # Verify checksums
    gpg --verify checksums.txt.sig checksums.txt
    sha256sum -c <(grep linux_amd64 checksums.txt)
    ```

    ## Install

    ```bash
    # Quick install (Linux/macOS)
    curl -fsSL https://rtmx.ai/install.sh | sh

    # Homebrew
    brew install rtmx-ai/tap/rtmx

    # Scoop (Windows)
    scoop bucket add rtmx https://github.com/rtmx-ai/scoop-bucket
    scoop install rtmx
    ```

brews:
  - name: rtmx
    repository:
      owner: rtmx-ai
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://rtmx.ai"
    description: "Requirements Traceability Matrix toolkit (CLI + verification broker)"
    license: "Apache-2.0"
    test: |
      system "#{bin}/rtmx", "version"
    install: |
      bin.install "rtmx"
      (libexec/"rtmx").mkpath
      (libexec/"rtmx").install "verify"
      (share/"rtmx").mkpath
      (share/"rtmx").install "share/rtmx/com.rtmx.verify.plist" if File.exist?("share/rtmx/com.rtmx.verify.plist")
      (share/"rtmx").install "share/rtmx/rtmx-verify.service" if File.exist?("share/rtmx/rtmx-verify.service")
      (share/"rtmx").install "share/rtmx/verify-service.json" if File.exist?("share/rtmx/verify-service.json")
    custom_block: |
      def post_install
        ohai "Enabling RTMX verification broker (Admin may be requested once)"
        system bin/"rtmx", "broker", "install", "--prefix=#{prefix}"
      rescue
        opoo "Broker enable deferred; first `rtmx verify` will elevate once"
      end
    caveats: |
      The verification broker ships with this formula. `brew install` /
      `brew upgrade` run `post_install` to enable or reload it (Admin may
      be requested once). If that step is skipped, the first `rtmx verify`
      elevates once. Steady-state `rtmx verify` does not prompt.

        rtmx broker status
        rtmx broker install --prefix=#{prefix}   # manual / fleet

scoops:
  - repository:
      owner: rtmx-ai
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://rtmx.ai"
    description: "Requirements Traceability Matrix toolkit"
    license: "Apache-2.0"

nfpms:
  - id: packages
    package_name: rtmx
    vendor: ioTACTICAL LLC
    homepage: https://rtmx.ai
    maintainer: RTMX Engineering <dev@rtmx.ai>
    description: Requirements Traceability Matrix toolkit (CLI + verification broker)
    license: Apache-2.0
    formats:
      - deb
      - rpm
    builds:
      - rtmx
      - verify
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/verify.service
        dst: /lib/systemd/system/rtmx-verify.service
        type: config|noreplace
    scripts:
      postinstall: packaging/nfpm/postinstall.sh

dockers:
  - image_templates:
      - 'ghcr.io/rtmx-ai/rtmx:{{ .Version }}-amd64'
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    goarch: amd64
    dockerfile: Dockerfile
  - image_templates:
      - 'ghcr.io/rtmx-ai/rtmx:{{ .Version }}-arm64'
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
    goarch: arm64
    dockerfile: Dockerfile

docker_manifests:
  - name_template: 'ghcr.io/rtmx-ai/rtmx:{{ .Version }}'
    image_templates:
      - 'ghcr.io/rtmx-ai/rtmx:{{ .Version }}-amd64'
      - 'ghcr.io/rtmx-ai/rtmx:{{ .Version }}-arm64'
  - name_template: 'ghcr.io/rtmx-ai/rtmx:latest'
    image_templates:
      - 'ghcr.io/rtmx-ai/rtmx:{{ .Version }}-amd64'
      - 'ghcr.io/rtmx-ai/rtmx:{{ .Version }}-arm64'
