<div style="display: flex; flex-direction: column; gap: 1.5rem;">
  <h2 style="font-size: 1.5rem; font-weight: 700;">Project Status</h2>

  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;">
    <div class="card" style="text-align: center;">
      <div class="stat-value stat-complete">{{.Complete}}</div>
      <div class="stat-label">Complete</div>
    </div>
    <div class="card" style="text-align: center;">
      <div class="stat-value stat-partial">{{.Partial}}</div>
      <div class="stat-label">Partial</div>
    </div>
    <div class="card" style="text-align: center;">
      <div class="stat-value stat-missing">{{.Missing}}</div>
      <div class="stat-label">Missing</div>
    </div>
    <div class="card" style="text-align: center;">
      <div class="stat-value">{{.Total}}</div>
      <div class="stat-label">Total</div>
    </div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
      <span style="font-size: 0.875rem; font-weight: 500;">Overall Progress</span>
      <span class="text-muted" style="font-size: 0.875rem;">{{.Percent}}%</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" style="width: {{.Percent}}%"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Categories</h3>
    <table class="data-table">
      <thead>
        <tr>
          <th>Category</th>
          <th>Complete</th>
          <th>Partial</th>
          <th>Missing</th>
          <th>Total</th>
          <th>Progress</th>
        </tr>
      </thead>
      <tbody>
        {{range .Categories}}
        <tr>
          <td style="font-weight: 500;">{{.Name}}</td>
          <td>{{.Complete}}</td>
          <td>{{.Partial}}</td>
          <td>{{.Missing}}</td>
          <td>{{.Total}}</td>
          <td>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <div class="cat-bar">
                <div class="cat-bar-fill" style="width: {{.Percent}}%"></div>
              </div>
              <span class="text-dim" style="font-size: 0.75rem; width: 2.5rem;">{{.Percent}}%</span>
            </div>
          </td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
