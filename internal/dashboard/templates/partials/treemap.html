<div style="display: flex; flex-direction: column; gap: 0.75rem;">
  <span class="text-muted" style="font-size: 0.8rem;">Treemap View</span>
  <div style="width: 100%; aspect-ratio: 16/9; min-height: 400px; border-radius: 0.375rem;">
    <svg id="treemap-svg" width="100%" height="100%"></svg>
  </div>
  <script type="application/json" id="treemap-data">{{.TreemapJSON}}</script>
  <script>
    (function() {
      var el = document.getElementById('treemap-data');
      if (el && typeof d3 !== 'undefined') {
        try {
          var data = JSON.parse(el.textContent);
          renderTreemap(data);
        } catch(e) {}
      }
    })();
  </script>
</div>
