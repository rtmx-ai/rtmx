<div style="display: flex; flex-direction: column; gap: 1rem;">
  <h2 style="font-size: 1.5rem; font-weight: 700;">Kanban Board</h2>

  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem;" x-data="kanbanBoard()">
    {{range .Columns}}
    <div class="kanban-column" data-status="{{.Status}}"
         @dragover.prevent="dragOver($event)" @drop="drop($event, '{{.Status}}')">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
        <h3 style="font-weight: 600; font-size: 0.875rem;">{{.Label}}</h3>
        <span class="text-dim" style="font-size: 0.75rem;">{{.Count}}</span>
      </div>
      {{range .Cards}}
      <div class="kanban-card pri-{{.PriorityClass}}" draggable="true"
           data-req-id="{{.ReqID}}"
           @dragstart="dragStart($event, '{{.ReqID}}')"
           @dragend="dragEnd($event)">
        <div class="req-id" style="font-size: 0.7rem;">{{.ReqID}}</div>
        <div style="font-size: 0.8rem; margin-top: 0.25rem;">{{.Description}}</div>
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem;">
          <span class="badge badge-{{.StatusClass}}">{{.Status}}</span>
          {{if .Blocked}}<span style="font-size: 0.7rem; color: var(--rtmx-missing);">[Blocked]</span>{{end}}
        </div>
      </div>
      {{end}}
    </div>
    {{end}}
  </div>
</div>

<script>
function kanbanBoard() {
  return {
    draggedId: null,
    dragStart: function(e, reqId) {
      this.draggedId = reqId;
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    },
    dragEnd: function(e) {
      e.target.classList.remove('dragging');
      this.draggedId = null;
    },
    dragOver: function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    },
    drop: function(e, status) {
      e.preventDefault();
      if (!this.draggedId) return;
      htmx.ajax('PATCH', '/api/requirements/' + this.draggedId, {
        values: {status: status},
        target: '#content',
        swap: 'innerHTML'
      }).then(function() {
        htmx.ajax('GET', '/partials/kanban', {target: '#content', swap: 'innerHTML'});
      });
    }
  };
}
</script>
