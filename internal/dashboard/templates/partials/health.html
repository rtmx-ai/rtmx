<div style="display: flex; flex-direction: column; gap: 1rem;">
  <h2 style="font-size: 1.5rem; font-weight: 700;">Health Dashboard</h2>

  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;">
    <div class="card" style="text-align: center;">
      <div class="stat-value stat-complete">{{.Percent}}%</div>
      <div class="stat-label">Completion Rate</div>
    </div>
    <div class="card" style="text-align: center;">
      <div class="stat-value" style="color: var(--rtmx-medium);">{{.Velocity}}</div>
      <div class="stat-label">Reqs/Week (30d avg)</div>
    </div>
    <div class="card" style="text-align: center;">
      <div class="stat-value stat-partial">{{.BlockedCount}}</div>
      <div class="stat-label">Blocked Items</div>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size: 1.125rem; font-weight: 600; margin-bottom: 1rem;">Health Checks</h3>
    <table class="data-table">
      <thead>
        <tr>
          <th>Check</th>
          <th>Status</th>
          <th>Details</th>
        </tr>
      </thead>
      <tbody>
        {{range .Checks}}
        <tr>
          <td style="font-weight: 500;">{{.Name}}</td>
          <td>
            {{if .Pass}}
            <span class="health-pass" style="font-weight: 600;">PASS</span>
            {{else}}
            <span class="health-fail" style="font-weight: 600;">FAIL</span>
            {{end}}
          </td>
          <td class="text-muted" style="font-size: 0.8rem;">{{.Detail}}</td>
        </tr>
        {{end}}
      </tbody>
    </table>
  </div>
</div>
